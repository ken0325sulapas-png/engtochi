<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>English → Chinese Translator (Online)</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f2f5;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px;
    }
    h1 { color: #333; }
    textarea {
      width: 400px;
      height: 120px;
      margin: 10px 0;
      padding: 10px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    button {
      background: #0078d7;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover { background: #005a9e; }
    #output {
      margin-top: 20px;
      width: 400px;
      min-height: 100px;
      padding: 10px;
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 18px;
    }
  </style>
</head>
<body>
  <h1>English → Chinese Translator</h1>
  <textarea id="inputText" placeholder="Type English text here..."></textarea>
  <button onclick="translateText()">Translate</button>
  <div id="output"></div>

  <script>
    async function translateText() {
      const text = document.getElementById("inputText").value;
      if (!text) {
        document.getElementById("output").innerText = "Please enter some text.";
        return;
      }

      try {
        const response = await fetch("https://libretranslate.de/translate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            q: text,
            source: "en",
            target: "zh",
            format: "text"
          })
        });

        if (!response.ok) {
          throw new Error("API unreachable");
        }

        const data = await response.json();
        document.getElementById("output").innerText = data.translatedText;
      } catch (error) {
        document.getElementById("output").innerText =
          "Error: Check your WiFi connection or API status.\nError Code: HMPS Akhila (CV-29)";
      }
    }
  </script>
</body>
</html>
